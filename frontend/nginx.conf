server {
    listen 80;
    server_name localhost;

    # Property registration uploads several photos and documents (up to 10 MB each) in one request.
    client_max_body_size 200m;

    include /etc/nginx/security-headers.conf;
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Versioned build files never change, so browsers may keep them for a year.
    # Module workers require a JavaScript MIME type on every nginx version.
    location ~ ^/assets/.*\.mjs$ {
        root /usr/share/nginx/html;
        types { application/javascript mjs; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Real visitor IP for per-user rate limits (the backend trusts this one proxy hop).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passed through only when an HTTPS proxy in front already set it; empty means plain HTTP (no redirect).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Allow slow uploads and file processing to finish.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://media_storage:80/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # Repeat the shared policy because local cache headers override header inheritance.
        include /etc/nginx/security-headers.conf;
    }
}
