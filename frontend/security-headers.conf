# Security headers (OWASP ZAP): CSP lists only the services the site uses. 'unsafe-eval' is needed by
# the iPhone photo (HEIC) converter; 'unsafe-inline' styles by Vue style bindings and Google Maps.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://unpkg.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://*.googleusercontent.com https://cdn-icons-png.flaticon.com https://placehold.co; connect-src 'self' blob: https://*.googleapis.com https://*.google.com https://*.gstatic.com https://psgc.gitlab.io https://res.cloudinary.com https://unpkg.com; frame-src 'self' blob: https://res.cloudinary.com https://*.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
