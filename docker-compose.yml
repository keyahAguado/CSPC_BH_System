version: '3.8'

services:
  # --- 1. MySQL 8.0 Database Service ---
  db:
    image: mysql:8.0
    container_name: cspc_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cspc_boarding_db
      MYSQL_USER: cspc_user
      MYSQL_PASSWORD: cspc_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 2. Express API Backend Service ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cspc_backend_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=cspc_user
      - DB_PASSWORD=cspc_password
      - DB_NAME=cspc_boarding_db
      - DB_PORT=3306
      - PORT=3000
      - JWT_SECRET=cspc_secret_key_2026
    depends_on:
      db:
        condition: service_healthy

  # --- 3. Vue 3 Frontend Service ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cspc_frontend_app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: