services:
  # --- 1. MySQL 8.0 Database Service ---
  db:
    image: mysql:8.0
    container_name: cspc_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cspc_boarding_db
      MYSQL_USER: cspc_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Reachable only from this machine (e.g. MySQL Workbench on the server); the backend uses the internal network.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 2. Express API Backend Service ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cspc_backend_api
    # Forward signals and reap orphaned child processes. Applied on container recreation.
    init: true
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=cspc_user
      - DB_PASSWORD=${DB_PASSWORD}
      # Also set DB_PASS (read first by config/db.js) so a value in backend/.env cannot override it.
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=cspc_boarding_db
      - DB_PORT=3306
      - PORT=3000
      # Uploads go to the media_uploads volume, served by media_storage. All other backend
      # settings (FRONTEND_URL, JWT_SECRET, keys) come from backend/.env only.
      - STORAGE_PROVIDER=local
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # --- 3. Vue 3 Frontend Service ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Frontend settings are read at build time from frontend/.env.production.local
      # (see frontend/.env.example), falling back to frontend/.env.production.
    container_name: cspc_frontend_app
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
      media_storage:
        condition: service_healthy

  # --- 4. Dedicated Nginx Media Storage Service ---
  media_storage:
    image: nginx:alpine
    container_name: cspc_media_storage
    restart: always
    # Media is served to users through the frontend at /uploads/; direct access stays on this machine.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - media_uploads:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/uploads/ >/dev/null 2>&1 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  db_data:
  media_uploads: