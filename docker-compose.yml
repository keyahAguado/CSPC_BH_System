services:
  # --- 1. MySQL 8.0 Database Service ---
  db:
    image: mysql:8.0
    container_name: cspc_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cspc_boarding_db
      MYSQL_USER: cspc_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 2. Express API Backend Service ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cspc_backend_api
    # Forward signals and reap orphaned child processes. Applied on container recreation.
    init: true
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=cspc_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=cspc_boarding_db
      - DB_PORT=3306
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_PROVIDER=local
      - SMTP_SERVICE=${SMTP_SERVICE:-gmail}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # --- 3. Vue 3 Frontend Service ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY:-}
    container_name: cspc_frontend_app
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
      media_storage:
        condition: service_healthy

  # --- 4. Dedicated Nginx Media Storage Service (ICTU Compliant) ---
  media_storage:
    image: nginx:alpine
    container_name: cspc_media_storage
    restart: always
    ports:
      - "8080:80"
    volumes:
      - media_uploads:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/uploads/ >/dev/null 2>&1 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  db_data:
  media_uploads: